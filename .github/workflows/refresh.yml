name: Refresh snapshot & publish

on:
  push:
    branches: [main, master]
  schedule:
    # Rebuild the data every hour. GitHub may delay scheduled runs under load,
    # so the page always shows its own "data as of" time rather than implying live.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch a fresh snapshot from the Taskmarket API
        run: node scripts/fetch.mjs

      - name: Commit the refreshed snapshot
        run: |
          git config user.name  "taskmarket-visualizer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "data: refresh snapshot $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
